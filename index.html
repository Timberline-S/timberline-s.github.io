<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#F4F5F1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timberline"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.json">
<title>Timberline Field</title>
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F4F5F1;--surface:#fff;--sunk:#EFF1EC;--line:#E8EBE4;--line2:#DCE1D6;--ink:#101410;--ink2:#2F372E;--muted:#667064;--faint:#9AA397;--accent:#2F6B1F;--accent2:#5C9A2E;--soft:#EEF6E7;--softline:#CFE3BE;--char:#1F2125;--bad:#B42318;--badsoft:#FCE8E6;--warn:#995A00;--warnsoft:#FBEFD9;
--font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--display:"Plus Jakarta Sans","Inter",system-ui,sans-serif;--sh:0 1px 2px rgba(16,24,12,.04),0 8px 24px -8px rgba(16,24,12,.10)}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top,0px))}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:44px}
.top img{height:40px;width:auto;border-radius:8px}
.top .t{font:800 17px var(--display);letter-spacing:-.02em;line-height:1.1}.top .t small{display:block;font:600 11px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.top .sp{flex:1}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom,0px))}
h1{font:800 30px/1.1 var(--display);letter-spacing:-.035em;margin:0}
h2{font:700 18px var(--display);letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);margin:6px 0 0}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--sh);margin-top:16px;overflow:hidden}
.card>.h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.pad{padding:16px 18px}
.hero{border-radius:24px;padding:22px 20px;color:#fff;background:radial-gradient(120% 140% at 0% 0%,#2D3B2A 0%,#1A211A 50%,#141914 100%);position:relative;overflow:hidden;box-shadow:0 18px 40px -18px rgba(16,24,12,.55)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 90% at 90% 0%,rgba(124,184,72,.42),rgba(124,184,72,0) 60%);pointer-events:none}
.hero>*{position:relative}.hero .eb{font-size:13px;color:rgba(255,255,255,.72)}.hero h1{color:#fff;margin-top:4px}
.hero .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .stats span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-size:13px}
.hero .stats b{font-family:var(--display);margin-right:4px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border:0;border-radius:16px;background:linear-gradient(180deg,#3E8128,#2F6B1F);color:#fff;font:700 17px var(--font);box-shadow:0 10px 22px -10px rgba(47,107,31,.8);margin-top:16px;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:14px;border:1px solid var(--line2);background:#fff;padding:0 16px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.sm{height:36px;border-radius:11px;padding:0 12px;font-size:14px}
.btn.pri{background:linear-gradient(180deg,#3E8128,#2F6B1F);border-color:#2F6B1F;color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .tt{font-weight:650}.row .mm{font-size:13px;color:var(--muted)}
.row .grow{flex:1;min-width:0}
.ring{width:42px;height:42px;flex:none}
.pill{display:inline-block;font-size:12px;font-weight:650;padding:3px 9px;border-radius:8px;background:var(--sunk);color:var(--ink2)}

.empty{padding:22px 18px;color:var(--muted);font-size:14.5px}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip i{flex:none;width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--accent);font-style:normal;font-weight:800}
/* progress */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.tiles div{background:#fff;padding:14px 12px;display:grid;gap:2px}.tiles b{font:800 24px var(--display);letter-spacing:-.02em;color:var(--ink)}.tiles span{font-size:12.5px;color:var(--muted);line-height:1.3}

.cl{padding:16px 18px;border-top:1px solid var(--line)}.cl:first-child{border-top:0}
.clh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.cl .nm{font-weight:700;font-size:16px}.cl .mt{font-size:13.5px;color:var(--muted);margin-top:2px}
.cl .amt{font:800 17px var(--display);color:var(--accent);white-space:nowrap}
.cl .acts{display:flex;gap:8px;margin-top:10px}
.trk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:10px}
.trk span{font-size:11.5px;font-weight:650;color:var(--faint);padding-top:8px;border-top:4px solid var(--line);border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk span.on{color:var(--accent);border-top-color:var(--accent2)}.trk span.cur{color:var(--ink)}
.trk.lost{display:block}.trk.lost span{display:block;color:var(--bad);border-top-color:#E9B4AE}
.fu{margin-top:8px;font-size:13px;font-weight:650;color:var(--warn);background:var(--warnsoft);display:inline-block;padding:4px 10px;border-radius:8px}.fu.late{color:var(--bad);background:var(--badsoft)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:16px -16px 0;padding:0 16px 2px}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg button i{font-style:normal;color:var(--muted);margin-left:2px}.seg button[aria-pressed="true"]{background:var(--char);border-color:var(--char);color:#fff}.seg button[aria-pressed="true"] i{color:#C9CEC4}
.pill.r{background:var(--badsoft);color:var(--bad)}
/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="true"]{color:var(--accent)}
.tabs button[aria-current="true"] svg{background:var(--soft);border-radius:10px;padding:3px;box-sizing:content-box;margin:-3px}
/* wizard */
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px -16px 0;padding:0 16px 4px}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.steps button.done{color:var(--accent);border-color:var(--softline);background:var(--soft)}
.steps button[aria-current="true"]{background:var(--char);border-color:var(--char);color:#fff}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5C9A2E,#2F6B1F);border-radius:3px;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;padding:16px 18px}
@media(max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.f{display:grid;gap:6px;min-width:0}.f.full{grid-column:1/-1}
.f>label{font-size:13px;font-weight:600;color:var(--ink2)}.f>label i{color:var(--bad);font-style:normal}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%;border:1px solid var(--line2);background:#fff;border-radius:13px;height:50px;padding:0 13px;font-size:16px}
.f textarea{min-height:100px;height:auto;padding:12px 13px;resize:vertical;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 4px rgba(92,154,46,.16)}
.f .help{font-size:12.5px;color:var(--muted)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink2)}

.chk{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line2);border-radius:13px;background:#fff;font-weight:550}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.pkgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px 18px 0}
.pkgs button{text-align:left;border:1px solid var(--line2);background:#fff;border-radius:16px;padding:12px 14px;display:grid;gap:2px}
.pkgs button b{font-size:14.5px}.pkgs button span{font-size:12.5px;color:var(--muted)}
.pkgs button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.ltadd{padding:0 18px 14px}.ltadd:empty{display:none}.sf{margin:0 18px 16px;background:var(--soft);border:1px solid var(--softline);color:var(--accent);border-radius:14px;padding:12px 14px;font-weight:650;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:21;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.nav .in .btn{flex:1;height:52px}.nav .in .btn.pri{flex:2}
.saved{font-size:12px;color:var(--faint);text-align:center;margin-top:6px}
/* photos and sketch */
.addph{display:flex;align-items:center;justify-content:center;gap:10px;height:64px;border:2px dashed var(--softline);border-radius:16px;color:var(--accent);font-weight:700;background:var(--soft);cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--sunk)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(16,20,16,.72);color:#fff;font-weight:800;font-size:16px;line-height:1}
.sk{position:relative;border:1px solid var(--line2);border-radius:16px;background:#FCFDFB;height:320px;touch-action:none;overflow:hidden;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
.sk canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.sktools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* review */
.rv h3{font:600 12px var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:0;padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:center}
.rv h3 button{font:600 13px var(--font);text-transform:none;letter-spacing:0;border:0;background:none;color:var(--accent)}
.rv dl{display:grid;grid-template-columns:minmax(110px,40%) minmax(0,1fr);margin:0;padding:0 18px 10px}
.rv dt,.rv dd{margin:0;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.rv dt{color:var(--muted)}.rv dd{font-weight:550;white-space:pre-wrap;overflow-wrap:anywhere}
.miss{margin:12px 18px 0;padding:12px 14px;border-radius:14px;background:var(--badsoft);color:var(--bad);font-weight:600;font-size:14px}
/* playbook */
.pb details{border-top:1px solid var(--line)}.pb details:first-child{border-top:0}
.pb summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.pb summary::-webkit-details-marker{display:none}
.pb summary span{font-size:12.5px;font-weight:600;color:var(--muted)}
.pb ul{list-style:none;margin:0;padding:0 18px 12px}
.pb li label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line)}
.pb li input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:2px}
.pb li.done span{color:var(--faint);text-decoration:line-through}
.qa{padding:0 18px 14px;display:grid;gap:10px}
.qa div{background:var(--sunk);border-radius:14px;padding:12px 14px}.qa b{display:block;margin-bottom:3px}
.pt{padding:0 18px 14px;display:grid;gap:8px}.pt p{margin:0;padding:12px 14px;border-radius:14px;background:var(--soft);color:#1F3D14;font-weight:550}
/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(20,23,20,.42);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{grid-template-columns:minmax(0,1fr);background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:92vh;overflow:auto}
@media(prefers-reduced-motion:no-preference){.sheet.on .box{animation:up .22s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
.sheet h3{font:800 20px var(--display);margin:0}.sheet p{margin:0;color:var(--muted)}
.addr{display:flex;gap:8px;min-width:0}.addr .btn{flex:none}.addr input{flex:1;min-width:0;height:46px;border:1px solid var(--line2);border-radius:13px;padding:0 12px;background:var(--sunk)}
.appt{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:16px 18px;border-top:1px solid var(--line)}
.appt:first-child{border-top:0}
.appt .tm{font:800 17px var(--display);color:var(--accent);line-height:1.15}.appt .tm small{display:block;font:600 11.5px var(--font);color:var(--muted);margin-top:2px}
.appt .nm{font-weight:700;font-size:16px}.appt .mt{font-size:13.5px;color:var(--muted);margin-top:2px}
.appt .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.appt .note{margin-top:8px;font-size:13.5px;background:var(--sunk);border-radius:10px;padding:8px 10px;color:var(--ink2);white-space:pre-wrap}
.mo{padding:14px 14px 16px}.mo .mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.mo .mh b{font:600 16px var(--font);color:var(--ink)}.mo .mh button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:18px;color:var(--ink2)}
.mo .wk,.mo .gd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.mo .wk span{font:600 11px var(--font);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;padding-bottom:4px}
.mo .gd button{aspect-ratio:1/1;border:1px solid transparent;background:none;border-radius:10px;font:500 14.5px var(--font);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;min-height:40px}
.mo .gd button.x{color:#B9BDB4}.mo .gd button.td{border-color:var(--accent);font-weight:700}.mo .gd button[aria-pressed="true"]{background:var(--char);color:#fff}.mo .gd button i{display:flex;gap:2px;height:6px}.mo .gd button i u{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}.mo .gd button[aria-pressed="true"] i u{background:#CFE3BE}.mo .gd button.ps i u{background:#B9BDB4}
@media(min-width:1000px){.mcal{display:grid;grid-template-columns:400px minmax(0,1fr);align-items:start}.mcal .mday{border-left:1px solid var(--line);min-height:100%}.mcal .mday .dayh{padding-top:18px}}
.dayh{font:600 12px var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);padding:14px 18px 0}
.step2{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.step2 .n{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800}
.step2.ok .n{background:var(--accent);color:#fff}.step2.warn{background:#FFF6E5;border-radius:12px;padding:12px 10px;margin:0 -10px}
.step2 b{display:block;margin-bottom:6px}
.done{text-align:center;padding:36px 18px}
.done .ok{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(180deg,#3E8128,#2F6B1F);display:grid;place-items:center;box-shadow:0 14px 30px -12px rgba(47,107,31,.8)}
@media(prefers-reduced-motion:no-preference){.done .ok{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--char);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px);display:none}
[hidden]{display:none!important}
/* wide screens: iPad landscape, laptop, desktop */
.hm .c1>.card:first-child,.hm .c2>.card:first-child{margin-top:16px}
@media(min-width:700px){.sheet{align-items:center;padding:24px}.sheet .box{border-radius:24px;max-height:86vh}}
@media(min-width:1000px){
 html{scroll-padding-top:130px}
 .top .in,.wrap,.tabs .in{max-width:1120px}
 .tabs{top:65px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:6px 16px}
 .tabs .in{display:flex;gap:6px;justify-content:flex-start}
 .tabs button{display:flex;gap:8px;align-items:center;font-size:14px;padding:8px 14px;border-radius:12px}
 .tabs button svg{width:20px;height:20px}
 .tabs button[aria-current="true"]{background:var(--soft)}.tabs button[aria-current="true"] svg{background:none;padding:0;margin:0}
 .wrap{padding-top:84px;padding-bottom:60px}

 #main>.card>.appt{grid-template-columns:90px minmax(0,1fr)}

},{"k":"otherOpen","l":"Other openings","ph":"Sliding door, open bays"},{"t":"head","l":"Inside and finish"},{"k":"slab","l":"Concrete slab","t":"select","o":["","Yes, by us","Yes, by others","No slab","Not sure"]},{"k":"slabNotes","l":"Slab details","ph":"4 in, floor drain, radiant"},{"k":"insulation","l":"Insulation","t":"select","o":["","None","Roof only","Roof and walls","Spray foam","Not sure"]},{"k":"liner","l":"Interior liner","t":"select","o":["","None","Liner panel","Plywood or OSB","Drywall","Not sure"]},{"k":"wainscot","l":"Wainscot","t":"select","o":["","None","Metal","Stone","Other"]},{"k":"electrical","l":"Electrical","t":"select","o":["","By us","By owner","Not needed","Not sure"]},{"k":"plumbing","l":"Plumbing","t":"select","o":["","By us","By owner","Not needed","Not sure"]},{"k":"roofColor","l":"Roof color"},{"k":"wallColor","l":"Wall color"},{"k":"trimColor","l":"Trim color"},{"t":"head","l":"Site and permit"},{"k":"siteReady","l":"Site condition","t":"select","o":["","Level and ready","Needs excavation","Needs fill","Not sure"]},{"k":"access","l":"Truck access","t":"select","o":["","Good","Tight","Poor","Not sure"]},{"k":"power","l":"Power at the site","t":"select","o":["","Yes","No","Not sure"]},{"k":"hoa","l":"HOA or covenants","t":"select","o":["","Yes","No","Not sure"]},{"k":"jurisdiction","l":"County or city for the permit"},{"k":"miles","l":"Miles from Boise","num":1},{"k":"setbacks","l":"Setbacks, easements, septic or well near the build","t":"area"},{"t":"head","l":"Budget and timing"},{"k":"budget","l":"Budget range","ph":"$60k to $75k"},{"k":"start","l":"When they want to start"},{"k":"financing","l":"Paying with","t":"select","o":["","Cash","Financing","Not sure"]},{"k":"otherBids","l":"Other bids","ph":"Who, and price if they shared it"},{"t":"head","l":"Notes"},{"k":"scope","l":"Anything else for the quote","t":"area"},{"k":"temp","l":"How likely to buy","t":"select","o":["","Hot","Warm","Cold"]},{"k":"read","l":"Your read on the client","t":"area","ph":"How serious they are, concerns, what will close it"},{"k":"measured","l":"Measured the site","t":"check"},{"k":"photos","l":"Took site photos","t":"check"}],"P":[{"id":"p3040","name":"30x40 shop","type":"Post frame shop","use":"Shop or garage","width":"30","length":"40","eave":"14","pitch":"4/12","overhang":"12 in","ohd":"2 at 12x12","manDoors":"1","windows":"2 at 3x3","slab":"Yes, by us","insulation":"Roof and walls","liner":"None","wainscot":"Metal"},{"id":"p4060","name":"40x60 shop with lean to","type":"Post frame shop","use":"Shop or garage","width":"40","length":"60","eave":"16","pitch":"4/12","overhang":"12 in","ohd":"2 at 14x14","manDoors":"2","windows":"4 at 3x3","slab":"Yes, by us","insulation":"Roof and walls","liner":"None","wainscot":"Metal","lt1Depth":"12","lt1Len":"60","lt1Type":"Open"},{"id":"prv","name":"RV and boat storage","type":"Pole barn","use":"RV or boat storage","width":"30","length":"50","eave":"16","pitch":"4/12","overhang":"12 in","ohd":"1 at 14x14, 1 at 12x12","manDoors":"1","windows":"2 at 3x3","slab":"Yes, by us","insulation":"Roof only","liner":"None","wainscot":"None"},{"id":"pgar","name":"24x30 garage","type":"Garage","use":"Shop or garage","width":"24","length":"30","eave":"10","pitch":"5/12","overhang":"12 in","ohd":"2 at 9x8","manDoors":"1","windows":"2 at 3x3","slab":"Yes, by us","insulation":"Roof and walls","liner":"None","wainscot":"None"},{"id":"pbarndo","name":"40x60 barndominium shell","type":"Barndominium","use":"Living space","width":"40","length":"60","eave":"12","pitch":"4/12","overhang":"18 in","ohd":"1 at 12x10","manDoors":"2","windows":"8 at 4x4","slab":"Yes, by us","insulation":"Spray foam","liner":"None","wainscot":"Metal","lt1Depth":"10","lt1Len":"40","lt1Type":"Open"},{"id":"phorse","name":"36x48 horse barn","type":"Pole barn","use":"Horses or livestock","width":"36","length":"48","eave":"12","pitch":"4/12","overhang":"12 in","ohd":"","manDoors":"2","windows":"4 at 3x3","slab":"No slab","insulation":"None","liner":"Liner panel","wainscot":"Metal","lt1Depth":"12","lt1Len":"48","lt1Type":"Open"},{"id":"pequip","name":"30x60 equipment shed","type":"Pole barn","use":"Equipment storage","width":"30","length":"60","eave":"14","pitch":"4/12","overhang":"12 in","ohd":"","manDoors":"1","windows":"","slab":"No slab","insulation":"None","liner":"None","wainscot":"None"}],"G":"# Before you go\nText the client to confirm the time and address\nLook the property up on the map: access, slope, power pole, septic and well\nBring a tape and wheel, the brochure, and your phone charged for photos\nCheck the county or city for setbacks if the lot looks tight\n\n# On site\nIntroduce yourself and Timberline. Ask what they will use the building for\nWalk the build spot together and mark the corners\nMeasure the pad and note the slope and drainage\nTake photos of all four corners, the access route, power and anything in the way\nAsk about doors: how many, what size, what they need to drive through them\nTalk through slab, insulation, liner and wainscot\nPick a scope package in the intake form, then adjust it to what they want\nAsk about budget and timing, and who else is part of the decision\n\n# What sets us apart\nOur price includes engineering, the permit and site prep, so the number does not climb later\nStamped plans for every building\nOne point of contact from signing to the final walkthrough\nSigned change orders before any extra work, so there are no surprise bills\n\n# Close the appointment\nTell them the proposal will be ready within 48 hours\nSet the follow up time while you are standing there\nSend the intake to the office before you leave the driveway\n\n# Common questions\nThe steel kit company is cheaper: ask if their price includes the slab, permit, engineering, site prep and labor. Ours does.\nI need to think about it: agree on a day to talk, and ask what would make it an easy yes.\nCan you start sooner: start dates are held with the signed agreement and deposit, so the sooner it is signed, the sooner we build."},OFFICE='timberlinebuilders.info@gmail.com',KEY='tl-field-v3';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* storage */

function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));const w=$('#wsaved');if(w)w.textContent='Saved on this phone '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}catch(e){const w=$('#wsaved');if(w)w.textContent='This phone is not letting the page save. Finish and send before closing.'}}
let idb=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('tl-field',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>res(null)}catch(e){res(null)}})}
const mem={};
function fput(k,v){mem[k]=v;if(!idb)return Promise.resolve();return new Promise(res=>{try{const t=idb.transaction('files','readwrite');t.objectStore('files').put(v,k);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
function fget(k){if(mem[k])return Promise.resolve(mem[k]);if(!idb)return Promise.resolve(null);return new Promise(res=>{try{const q=idb.transaction('files').objectStore('files').get(k);q.onsuccess=()=>{mem[k]=q.result||null;res(q.result||null)};q.onerror=()=>res(null)}catch(e){res(null)}})}
function fdel(k){delete mem[k];if(!idb)return;try{idb.transaction('files','readwrite').objectStore('files').delete(k)}catch(e){}}

/* intake model */
const SECS=[];let cur=null;
F.forEach(f=>{if(f.t==='head'){cur={h:f.l,f:[]};SECS.push(cur)}else if(cur&&f.k&&!['spacer','pkg'].includes(f.t))cur.f.push(f)});

const CHIPS={width:['24','30','36','40','50','60'],length:['30','40','48','50','60','80'],eave:['10','12','14','16','18'],ohd:['1 at 10x10','2 at 12x12','2 at 12x14','1 at 14x14'],manDoors:['1','2','3'],windows:['2 at 3x3','4 at 3x3','4 at 4x4'],budget:['Under $50k','$50k to $75k','$75k to $100k','$100k to $150k','$150k plus'],start:['ASAP','This spring','This summer','This fall','Next year']};

function draft(){return S.cur&&S.drafts[S.cur]}
function filled(d){return reqs.filter(f=>d.v[f.k]).length/reqs.length}
function missing(d){return reqs.filter(f=>!d.v[f.k])}
function sqft(v){const w=+v.width,l=+v.length;if(!(w>0&&l>0))return null;let s=w*l;[1,2].forEach(i=>{const dp=+v['lt'+i+'Depth'];const ln=+v['lt'+i+'Len']||l;if(dp>0)s+=dp*ln});return {main:w*l,total:s}}

/* progress from the office */
const CL=()=>((S.sched&&S.sched.clients)||[]);
const d10=x=>String(x||'').replace(/\D/g,'').slice(-10);
function matchClient(x){const v=(x.d&&x.d.v)||{};const lid=x.d&&x.d.lid;const L=CL();return L.find(c=>lid&&c.id===lid)||L.find(c=>d10(v.phone)&&d10(c.phone)===d10(v.phone))||L.find(c=>c.name&&String(c.name).trim().toLowerCase()===String(x.name||'').trim().toLowerCase())||null}
const money=n=>n==null||n===''?'':'$'+Math.round(+n).toLocaleString();
const shortD=ms=>ms?new Date(ms).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
const STG=['Appointment','Intake','Proposal','Signed'];
function stIdx(c){return c.stage==='Signed'?3:(c.stage==='Quote sent'||c.stage==='Accepted')?2:c.stage==='Quoting'?1:0}
const STLBL={'Assigned':'Book the appointment','Appointment set':'Appointment set','Quoting':'Office is pricing it','Quote sent':'Proposal sent','Accepted':'Accepted, contract next','Signed':'Signed','Lost':'Lost'};
function sentState(x){const c=matchClient(x);if(c&&(c.intakeAt||stIdx(c)>0))return {k:'ok',t:'Office received'};const age=Date.now()-x.at;return age>3*36e5?{k:'bad',t:'Not at the office yet'}:{k:'wait',t:'On its way'}}
function monthStats(){const L=CL();const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);const t0=m0.getTime();
  const intakes=L.filter(c=>c.intakeAt>=t0).length;const out=L.filter(c=>c.stage==='Quote sent'||c.stage==='Accepted');const signed=L.filter(c=>c.signedAt>=t0);
  const closed=L.filter(c=>c.stage==='Signed'||c.stage==='Lost');const rate=closed.length?Math.round(100*L.filter(c=>c.stage==='Signed').length/closed.length):null;
  return {intakes,out:out.length,outAmt:out.reduce((a,c)=>a+(+c.quoteAmount||0),0),signed:signed.length,signedAmt:signed.reduce((a,c)=>a+(+c.quoteAmount||0),0),rate}}
function tracker(c){if(c.stage==='Lost')return `<div class="trk lost"><span>Lost${c.lostReason?': '+esc(c.lostReason):''}</span></div>`;const k=stIdx(c);return `<div class="trk">${STG.map((s,i)=>`<span class="${i<=k?'on':''}${i===k?' cur':''}">${s}</span>`).join('')}</div>`}
function clientCard(c){const ph=d10(c.phone);const fu=c.nextFollowUp&&(c.stage==='Quote sent')?c.nextFollowUp:'';const td=isoD(new Date());
  const facts=[c.apptDate?'Appt '+new Date(c.apptDate+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'',c.intakeAt?'Intake '+shortD(c.intakeAt):'',c.quoteSentAt?'Proposal '+shortD(c.quoteSentAt):'',c.signedAt?'Signed '+shortD(c.signedAt):''].filter(Boolean);
  return `<div class="cl"><div class="clh"><div style="min-width:0"><div class="nm">${esc(c.name||'Client')}</div><div class="mt">${esc([cap(c.building||''),c.city].filter(Boolean).join(' · '))}</div></div>${c.quoteAmount?`<div class="amt">${money(c.quoteAmount)}</div>`:''}</div>
   ${tracker(c)}<div class="mt" style="margin-top:8px"><b style="color:var(--ink2)">${esc(STLBL[c.stage]||c.stage||'')}</b>${facts.length?' · '+esc(facts.join(' · ')):''}</div>
   ${fu?`<div class="fu ${fu<td?'late':fu===td?'today':''}">Follow up ${fu<td?'was due ':''}${esc(dayKey(fu))}</div>`:''}
   ${ph?`<div class="acts"><a class="btn sm" href="tel:${ph}" target="_top">Call</a><a class="btn sm" href="sms:${ph}" target="_top">Text</a></div>`:''}</div>`}
function statsCard(){if(!S.code)return '';const L=CL();if(!S.sched)return '';const m=monthStats();
  return `<div class="card"><div class="h"><h2>Your numbers</h2>${tab==='clients'?'':'<button class="btn sm ghost" type="button" data-tab="clients">My clients</button>'}</div>
   <div class="tiles"><div><b>${m.intakes}</b><span>Intakes this month</span></div><div><b>${m.out}</b><span>Proposals out${m.outAmt?'<br>'+money(m.outAmt):''}</span></div><div><b>${m.signed}</b><span>Signed this month${m.signedAmt?'<br>'+money(m.signedAmt):''}</span></div><div><b>${m.rate==null?'--':m.rate+'%'}</b><span>Close rate, all time</span></div></div></div>`}
let clf='open';
function vClients(){
  if(!S.code){$('#main').innerHTML=`<h1>My clients</h1><p class="sub">Every client the office has for you, and where each one stands.</p><div class="card"><div class="empty">Add your schedule code first. Tap your name at the top.</div></div>`;return}
  const L=CL().slice().sort((a,b)=>(b.updated||0)-(a.updated||0));const f={open:c=>c.stage!=='Signed'&&c.stage!=='Lost',quote:c=>c.stage==='Quote sent'||c.stage==='Accepted',signed:c=>c.stage==='Signed',lost:c=>c.stage==='Lost',all:()=>true};

   ${S.schedErr==='nocode'?`<div class="miss" style="margin:14px 0 0">That schedule code was not found. Tap your name at the top and check the code with the office.</div>`:(!S.sched&&S.schedErr==='offline')?`<div class="card"><div class="empty">You are offline. Your clients show as soon as you have signal.</div></div>`:''}
   ${statsCard()}

/* views */

function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===t)));render();window.scrollTo(0,0)}
function render(){

function isStandalone(){try{return navigator.standalone===true||matchMedia('(display-mode: standalone)').matches}catch(e){return false}}
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function ring(p){const R=17,C=2*Math.PI*R;return `<svg class="ring" viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="${R}" fill="none" stroke="#E8EBE4" stroke-width="5"/><circle cx="21" cy="21" r="${R}" fill="none" stroke="#2F6B1F" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 21 21)"/><text x="21" y="25" text-anchor="middle" style="font:700 11px Inter,sans-serif;fill:#2F372E">${Math.round(p*100)}</text></svg>`}
function draftRows(){const L=Object.values(S.drafts).sort((a,b)=>b.updated-a.updated);return L.length?L.map(d=>`<button class="row" data-open="${d.id}" type="button">${ring(filled(d))}<span class="grow"><span class="tt">${esc(d.v.name||'New client')}</span><br><span class="mm">${esc([d.v.city,d.v.width&&d.v.length?d.v.width+'x'+d.v.length:'',new Date(d.updated).toLocaleDateString('en-US',{month:'short',day:'numeric'})].filter(Boolean).join(' · '))}</span></span><span class="pill w">Draft</span></button>`).join(''):''}
function vHome(){
  const tips=(G().find(s=>/sets us apart/i.test(s.h))||{items:[]}).items;const tip=tips.length?tips[new Date().getDate()%tips.length]:'';
  const wk=S.sent.filter(s=>Date.now()-s.at<7*864e5).length;
  $('#main').innerHTML=`<div class="hm"><div class="c1"><section class="hero"><div class="eb">${esc(new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}))}</div><h1>${greet()}${S.name?', '+esc(S.name):''}</h1>
   <div class="stats"><span><b>${Object.keys(S.drafts).length}</b>in progress</span><span><b>${wk}</b>sent this week</span>${S.sched&&S.sched.clients?(n=>`<span><b>${n}</b>proposal${n===1?'':'s'} out</span>`)(CL().filter(c=>c.stage==='Quote sent'||c.stage==='Accepted').length):`<span><b>${S.sent.length}</b>sent total</span>`}</div></section>
   <button class="big" data-new type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Start a new intake</button>

   </div><div class="c2">${statsCard()}
   ${tip?`<div class="card"><div class="pad tip"><i>✓</i><div><b style="display:block;margin-bottom:2px">Say this today</b><span style="color:var(--ink2)">${esc(tip)}</span></div></div></div>`:''}
   <div class="card"><div class="h"><h2>Sent to the office</h2></div>${S.sent.length?S.sent.slice(0,12).map((s,i)=>`<div class="row"><span class="grow"><span class="tt">${esc(s.name)}</span><br><span class="mm">${esc([s.city,new Date(s.at).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),s.photos&&s.photos.length?s.photos.length+(s.photos.length===1?' photo':' photos'):''].filter(Boolean).join(' · '))}</span></span>${(()=>{const st=S.sched?sentState(s):null;return `<span style="display:grid;gap:6px;justify-items:end">${st?`<span class="pill ${st.k==='ok'?'g':st.k==='bad'?'r':'w'}">${st.t}</span>`:''}${s.d&&(!st||st.k==='bad')?`<button class="btn sm" type="button" data-resend="${i}">Send again</button>`:''}</span>`})()}</div>`).join(''):'<div class="empty">Intakes you send show here, with a check once the office has them.</div>'}${S.sent.some(x=>S.sched&&sentState(x).k==='bad')?`<div class="pad" style="font-size:13.5px;color:var(--muted);border-top:1px solid var(--line)">Not at the office yet means the email did not go through. Tap Send again, then tap Send in the email.</div>`:''}</div>

function newDraft(){if(!S.name){askName(newDraft);return}const id=uid();S.drafts[id]={id,v:{},step:0,photos:[],created:Date.now(),updated:Date.now()};S.cur=id;persist();tab='intake';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab==='intake')));render();window.scrollTo(0,0)}

function fieldHtml(f,v){
  const id='f_'+f.k,val=v[f.k]??'';const lab=`<label for="${id}">${esc(f.l)}${f.req?' <i>*</i>':''}</label>`;
  const chips=CHIPS[f.k]?`<div class="chips">${CHIPS[f.k].map(c=>`<button type="button" data-chip="${f.k}" data-val="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:'';
  if(f.t==='check')return `<div class="f full"><label class="chk"><input type="checkbox" id="${id}" data-k="${f.k}" ${val==='Yes'?'checked':''}>${esc(f.l)}</label></div>`;
  let inp;
  if(f.t==='select')inp=`<select id="${id}" data-k="${f.k}">${f.o.map(o=>`<option ${o===val?'selected':''} value="${esc(o)}">${esc(o||'Choose')}</option>`).join('')}</select>`;
  else if(f.t==='area')inp=`<textarea id="${id}" data-k="${f.k}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
  else inp=`<input id="${id}" data-k="${f.k}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.num?'inputmode="decimal"':''} ${f.k==='phone'?'type="tel" autocomplete="tel"':f.k==='email'?'type="email" autocomplete="email"':''}>`;
  return `<div class="f${f.t==='area'?' full':''}" data-wrap="${f.k}">${lab}${inp}${chips}${f.help?`<span class="help">${esc(f.help)}</span>`:''}</div>`;
}

      <div class="thumbs" id="thumbs"></div><p class="sub" style="font-size:13.5px">All four corners, the access route, power and anything in the way.</p></div></div>

  }else{

     <h3>Photos and sketch<button type="button" data-go="${STEPS.length-2}">Edit</button></h3><p class="sub" style="padding:0 18px 14px;margin:0;font-size:14px">${(d.photos||[]).length} photo${(d.photos||[]).length===1?'':'s'}${d.sketch?' and a site sketch':''}${sf?` · ${sf.total.toLocaleString()} sq ft under roof`:''}</p></div>
     <button class="big" data-send type="button">Send to the office</button>
     <button class="btn ghost danger" data-deldraft type="button" style="width:100%;margin-top:8px">Delete this draft</button>`;
  }
  $('#main').innerHTML=`<div class="wiz-wrap"><div style="display:flex;align-items:center;gap:10px"><button class="btn sm ghost" data-home type="button" aria-label="Back to home">‹ Home</button><span class="sp" style="flex:1"></span><span class="sub" style="margin:0;font-size:13px">Step ${d.step+1} of ${STEPS.length}</span></div>
   <h1 style="margin-top:6px">${esc(v.name||'New intake')}</h1>

   <div class="steps" id="stepbar">${STEPS.map((s,i)=>`<button type="button" data-go="${i}" aria-current="${i===d.step}" class="${done(i)&&i!==d.step?'done':''}">${done(i)&&i!==d.step?'✓ ':''}${esc(s.t)}</button>`).join('')}</div>

  $('#main').innerHTML=`<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px"><div><h1>Schedule</h1><p class="sub">${S.sched&&S.sched.updated?'Updated '+esc(new Date(S.sched.updated).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'}))+(S.schedErr==='offline'?' · offline, showing the last copy':''):S.schedErr==='offline'?'No signal right now':S.schedErr==='nocode'?'Code not found':'Loading your appointments'}</p></div><button class="btn sm" type="button" data-refresh>Refresh</button></div>${st}
   <div class="seg" role="group" aria-label="View"><button type="button" data-sv="list" aria-pressed="${!mv}">List</button><button type="button" data-sv="month" aria-pressed="${mv}">Month</button></div>
   ${mv?monthView():`<div class="card">${U.length?U.map(a=>{const h=a.date!==last?`<div class="dayh">${esc(dayKey(a.date))}</div>`:'';last=a.date;return h+apptCard(a,1)}).join(''):`<div class="empty">${S.schedErr==='nocode'?'Tap your name at the top to fix the code.':(!S.sched&&S.schedErr==='offline')?'You are offline. Your appointments show as soon as you have signal.':S.sched?'No upcoming appointments. New ones show here within the hour after the office adds them.':'Checking for appointments.'}</div>`}</div>`}
   <p class="sub" style="font-size:13px;margin-top:12px">Tap Start intake at the site and the client’s details are filled in for you.</p>`;
}
function monthView(){const all=((S.sched&&S.sched.appts)||[]).slice().sort((a,b)=>(a.date+(a.t24||'99')).localeCompare(b.date+(b.t24||'99')));const by={};all.forEach(a=>{(by[a.date]=by[a.date]||[]).push(a)});
  const now=new Date();const td=isoD(now);if(!S.mo)S.mo=td.slice(0,7);const [y,m]=S.mo.split('-').map(Number);const first=new Date(y,m-1,1);const start=new Date(first);start.setDate(1-first.getDay());
  const sel=S.sd&&S.sd.slice(0,7)===S.mo?S.sd:(td.slice(0,7)===S.mo?td:isoD(first));let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);if(i>=35&&d.getMonth()!==m-1)break;const k=isoD(d);const n=(by[k]||[]).length;
    cells+=`<button type="button" data-sd="${k}" aria-pressed="${k===sel}" aria-label="${esc(d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}))}${n?', '+n+' appointment'+(n>1?'s':''):''}" class="${d.getMonth()!==m-1?'x':''} ${k===td?'td':''} ${k<td?'ps':''}">${d.getDate()}<i>${'<u></u>'.repeat(Math.min(n,3))}</i></button>`}
  const L=by[sel]||[];const mn=all.filter(a=>a.date.slice(0,7)===S.mo).length;
  return `<div class="card mcal"><div class="mo"><div class="mh"><button type="button" data-mo="-1" aria-label="Previous month">‹</button><b>${esc(first.toLocaleDateString('en-US',{month:'long',year:'numeric'}))}</b><button type="button" data-mo="1" aria-label="Next month">›</button></div>
   <div class="wk">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<span>${x}</span>`).join('')}</div><div class="gd">${cells}</div>
   <p class="sub" style="font-size:13px;margin:10px 2px 0">${mn?mn+' appointment'+(mn>1?'s':'')+' this month':'No appointments this month'}${S.mo!==td.slice(0,7)?' · <button type="button" class="btn sm ghost" data-mo="0" style="padding:4px 10px">Today</button>':''}</p></div>
   <div class="mday"><div class="dayh">${esc(dayKey(sel))}</div>${L.length?L.map(a=>apptCard(a,1)).join(''):`<div class="empty">Nothing booked this day.</div>`}</div></div>`}
function startFor(id){const a=((S.sched&&S.sched.appts)||[]).find(x=>x.id===id);if(!a)return;if(!S.name){askName(()=>startFor(id));return}
  if(!S.drafts[id]){S.drafts[id]={id,lid:id,v:{name:a.name||'',phone:a.phone||'',email:a.email||'',address:a.address||'',city:a.city||'',type:a.type||''},step:0,photos:[],created:Date.now(),updated:Date.now()}}
  openDraft(id)}

/* playbook */
function cap(x){return x?x[0].toUpperCase()+x.slice(1):x}
function G(){const out=[];let c=null;String(D.G||'').split('\n').forEach(line=>{const t=line.trim();if(!t)return;if(t.startsWith('#')){c={h:t.replace(/^#+\s*/,''),items:[]};out.push(c)}else{if(!c){c={h:'Guide',items:[]};out.push(c)}c.items.push(t)}});return out}
function vPlaybook(){
  const g=G();
  $('#main').innerHTML=`<h1>Playbook</h1><p class="sub">Everything for a great first appointment. Checklists reset each day.</p>
   <div class="card pb">${g.map((s,si)=>{
     if(/common questions/i.test(s.h))return `<details open><summary>${esc(s.h)}<span>${s.items.length}</span></summary><div class="qa">${s.items.map(it=>{const i=it.indexOf(':');return i>0?`<div><b>${esc(it.slice(0,i))}</b>${esc(cap(it.slice(i+1).trim()))}</div>`:`<div>${esc(it)}</div>`}).join('')}</div></details>`;
     if(/sets us apart/i.test(s.h))return `<details open><summary>${esc(s.h)}<span>Say these</span></summary><div class="pt">${s.items.map(it=>`<p>${esc(it)}</p>`).join('')}</div></details>`;
     const day=new Date().toDateString();const k=S.pb||{};const doneN=s.items.filter((_,ii)=>k[day+'|'+si+'_'+ii]).length;
     return `<details open><summary>${esc(s.h)}<span>${doneN} of ${s.items.length}</span></summary><ul>${s.items.map((it,ii)=>{const kk=day+'|'+si+'_'+ii;return `<li class="${k[kk]?'done':''}"><label><input type="checkbox" data-pbk="${esc(kk)}" ${k[kk]?'checked':''}><span>${esc(it)}</span></label></li>`}).join('')}</ul></details>`}).join('')}</div>
   <div class="card"><div class="h"><h2>The first appointment deck</h2></div><div class="pad" style="color:var(--muted);font-size:14.5px">Ask the office for the Timberline presentation as a PDF and keep it on this phone. Walk the client through it before you measure.</div></div>`;
}

/* events */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,a,[data-open]');if(!t)return;
  if(t.dataset.tab){if(t.dataset.tab==='intake'&&S.cur&&S.drafts[S.cur]){S.cur=null;persist()}setTab(t.dataset.tab);if(['schedule','clients','home'].includes(t.dataset.tab)&&S.code&&Date.now()-(S.schedAt||0)>60000)loadSched();return}
  if(t.hasAttribute('data-new')){newDraft();return}
  if(t.dataset.open){openDraft(t.dataset.open);return}
  if(t.hasAttribute('data-home')||t.hasAttribute('data-homego')){readStep();S.cur=null;persist();setTab('home');return}
  if(t.dataset.go!=null&&t.dataset.go!==''){go(+t.dataset.go);return}
  if(t.dataset.chip){const el=document.querySelector(`[data-k="${t.dataset.chip}"]`);if(el){el.value=t.dataset.val;el.dispatchEvent(new Event('input',{bubbles:true}))}return}
  if(t.hasAttribute('data-addlt')){const d=draft();d.v._lt=ltN(d.v)+1;persist();bVis();const f=document.querySelector(`[data-wrap="lt${d.v._lt}Depth"] input`);if(f)f.focus();return}
  if(t.hasAttribute('data-hsdone')){S.hsDone=1;persist();vHome();return}
  if(t.dataset.clf){clf=t.dataset.clf;vClients();return}
  if(t.dataset.pkg){readStep();const d=draft();const p=P.find(x=>x.id===t.dataset.pkg);if(!p)return;const keepType=d.v.type&&!d.v._pkgType;Object.entries(p).forEach(([k,v])=>{if(k==='id'||k==='name')return;if(k==='type'&&keepType)return;d.v[k]=v});if(!keepType&&p.type)d.v._pkgType=1;d.v._pkg=p.id;persist();vWizard();toast(p.name+' filled in. Adjust anything that is different.');return}
  if(t.dataset.rmph){const d=draft();d.photos=(d.photos||[]).filter(x=>x!==t.dataset.rmph);fdel('ph_'+t.dataset.rmph);persist();drawThumbs();return}
  if(t.dataset.sk==='undo'){strokes.pop();initSketch.paint&&initSketch.paint();saveSketch();return}
  if(t.dataset.sk==='clear'){strokes.length=0;initSketch.paint&&initSketch.paint();saveSketch();return}
  if(t.hasAttribute('data-send')){send();return}
  if(t.dataset.startfor){startFor(t.dataset.startfor);return}
  if(t.dataset.sv){S.sv=t.dataset.sv;persist();render();return}
  if(t.dataset.sd){S.sd=t.dataset.sd;render();return}
  if(t.dataset.mo!=null&&t.dataset.mo!==''){const v=+t.dataset.mo;if(!v){S.mo=null;S.sd=null}else{const [y,m]=(S.mo||isoD(new Date()).slice(0,7)).split('-').map(Number);const d=new Date(y,m-1+v,1);S.mo=isoD(d).slice(0,7);S.sd=null}render();return}
  if(t.hasAttribute('data-refresh')){t.textContent='Refreshing';loadSched();return}
  if(t.hasAttribute('data-savecode')){const cd=(($('#sccode')||{}).value||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');if(!cd){toast('Enter the code from the office');return}S.code=cd;S.sched=null;persist();render();loadSched();return}
  if(t.dataset.resend!=null){const x=S.sent[+t.dataset.resend];if(x&&x.d)send(x.d);return}
  if(t.hasAttribute('data-deldraft')){if(t.dataset.arm!=='1'){t.dataset.arm='1';t.textContent='Tap again to delete';return}const d=draft();(d.photos||[]).forEach(id=>fdel('ph_'+id));delete S.drafts[d.id];S.cur=null;persist();setTab('home');toast('Draft deleted');return}
  if(t.hasAttribute('data-close')){closeSheet();return}
  if(t.hasAttribute('data-copy')){try{await navigator.clipboard.writeText(OFFICE);t.textContent='Copied'}catch(err){const i=t.previousElementSibling;i.select()}return}
  if(t.hasAttribute('data-copytext')){try{await navigator.clipboard.writeText(send.ctx.txt);t.textContent='Copied. Paste it in a text or email'}catch(err){t.textContent='Copy is blocked on this phone'}return}
  if(t.hasAttribute('data-share')){const c=send.ctx;try{await navigator.share({files:c.files,title:c.sub,text:c.txt});const x=$('#st2');if(x)x.classList.add('ok')}catch(err){if(err&&err.name==='AbortError')return;t.remove();toast('Sharing did not work here. Reply to the step 1 email with your photos.')}return}
  if(t.hasAttribute('data-dl')){const x=$('#st2');if(x)x.classList.add('ok');return}
  if(t.hasAttribute('data-mail')){const x=$('#st1');if(x)x.classList.add('ok');return}
  if(t.hasAttribute('data-marksent')){const x=$('#st1'),y=$('#st2');if(x&&!x.classList.contains('ok')&&!(y&&y.classList.contains('ok'))&&!t.dataset.sure){t.dataset.sure='1';x.classList.add('warn');t.textContent='I already sent the email';toast('Do step 1 first so the office gets the client');return}markSent();return}
  if(t.hasAttribute('data-savename')){const v=($('#nm').value||'').trim();if(!v){toast('Add your first name');return}S.name=v.replace(/^./,c=>c.toUpperCase());const cd=(($('#nmcode')||{}).value||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');if(cd!==(S.code||'')){S.code=cd;S.sched=null}persist();if(S.code)loadSched();closeSheet();render();const a=askName.after;askName.after=null;if(a)a();return}
  if(t.id==='who'){askName();return}
  if(t.id==='wback'){const d=draft();if(d.step===0){readStep();S.cur=null;persist();setTab('home')}else go(d.step-1);return}
  if(t.id==='wnext'){const d=draft();readStep();if(d.step===STEPS.length-1){send();return}if(!checkStep())return;go(d.step+1);return}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.k){const w=el.closest('.f.bad');if(w)w.classList.remove('bad');const d=draft();if(d){d.v[el.dataset.k]=el.type==='checkbox'?(el.checked?'Yes':''):String(el.value).trim();d.updated=Date.now();persist();if(['width','length','lt1Depth','lt1Len','lt2Depth','lt2Len'].includes(el.dataset.k))drawSf();if(el.dataset.k==='loft')bVis();if(el.dataset.k==='name'){const h=document.querySelector('#main h1');if(h)h.textContent=el.value||'New intake'}}}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='ph'){const fl=[...el.files];el.value='';if(fl.length)addPhotos(fl);return}if(el.dataset&&el.dataset.pbk){S.pb=S.pb||{};const today=new Date().toDateString();Object.keys(S.pb).forEach(k=>{if(!k.startsWith(today))delete S.pb[k]});if(el.checked)S.pb[el.dataset.pbk]=1;else delete S.pb[el.dataset.pbk];persist();el.closest('li').classList.toggle('done',el.checked);const dt=el.closest('details');if(dt){const all=dt.querySelectorAll('[data-pbk]'),on=dt.querySelectorAll('[data-pbk]:checked');const sp=dt.querySelector('summary span');if(sp)sp.textContent=on.length+' of '+all.length}return}if(el.dataset&&el.dataset.k)el.dispatchEvent(new Event('input',{bubbles:true}))});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm'){e.preventDefault();$('[data-savename]').click()}});

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.code&&Date.now()-(S.schedAt||0)>5*60000)loadSched()});
idbOpen().then(()=>{pruneSent();persist();setTab('home');if(S.code)loadSched();if(!S.name)askName()});
})();
</script>
